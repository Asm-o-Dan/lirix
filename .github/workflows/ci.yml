name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install private translation native toolchain
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Run Unit Tests
        run: ./gradlew :app:testPrivateDebugUnitTest :app:testCompactDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assemblePrivateDebug :app:assembleCompactDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lirix-debug-apk
          path: |
            app/build/outputs/apk/private/debug/app-private-debug.apk
            app/build/outputs/apk/compact/debug/app-compact-debug.apk
