name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure permanent release signing
        if: github.ref_name != 'v1.5.0'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Permanent Android signing secrets are required; refusing to publish with a generated debug key."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lirix-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/lirix-release.jks" >> "$GITHUB_ENV"

      - name: Test and build Android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: lirix-release
        run: ./gradlew :shared:desktopTest :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Rename APK for Release
        if: github.ref_name != 'v1.5.0'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/lirix-${RELEASE_TAG}.apk"

      - uses: actions/upload-artifact@v4
        if: github.ref_name != 'v1.5.0'
        with:
          name: android-release
          path: release-artifacts/*
          if-no-files-found: error

  windows:
    # v1.5.0 is Android-only; later releases retain Windows packaging.
    if: github.ref_name != 'v1.5.0'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and package Windows
        run: .\gradlew.bat :desktop:test :desktop:packageDistributionForCurrentOS --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  release:
    needs: [android, windows]
    # v1.5.0 is signed locally with the permanent private key and uploaded manually.
    # CI has no signing key and must not overwrite the verified APK with a debug-signed build.
    if: ${{ always() && github.ref_name != 'v1.5.0' && needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Calculate checksums
        run: |
          cd release-artifacts
          find . -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.msi' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          fail_on_unmatched_files: true
          body_path: .sdd/releases/${{ github.ref_name }}.md
          name: "Lirix ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
