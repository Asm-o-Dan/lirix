name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and build Android
        run: ./gradlew :shared:desktopTest :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Rename APK for Release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/lirix-${RELEASE_TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and package Windows
        run: .\gradlew.bat :desktop:test :desktop:packageDistributionForCurrentOS --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Calculate checksums
        run: |
          cd release-artifacts
          find . -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.msi' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          fail_on_unmatched_files: true
          body_path: .sdd/releases/${{ github.ref_name }}.md
          name: "Lirix ${{ github.ref_name }}"
          draft: false
          prerelease: true
